<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="50%" stop-color="#14171d" />
      <stop offset="100%" stop-color="#0f1115" />
    </linearGradient>

    <!-- Geometric Accent Gradients -->
    <linearGradient id="meshGrad1" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#2a3547" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#14171d" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="meshGrad2" x1="100%" y1="100%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#253040" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#14171d" stop-opacity="0.0" />
    </linearGradient>

    <!-- AAAI Logo Gradient -->
    <linearGradient id="aaaiBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
    <linearGradient id="aaaiGrey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b949e" />
      <stop offset="100%" stop-color="#484f58" />
    </linearGradient>

    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 31px; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #d0d7de; }
      .author-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 500; fill: #c9d1d9; }
      .affil-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 400; fill: #8b949e; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGrad)" />

  <!-- Subtle Geometric Angles -->
  <polygon points="0,0 480,0 160,360 0,360" fill="url(#meshGrad1)" />
  <polygon points="1200,80 820,360 1200,360" fill="url(#meshGrad2)" />
  <rect width="1200" height="360" rx="14" fill="none" stroke="#30363d" stroke-width="1.5" />

  <!-- ================= LEFT: AAAI ICON ================= -->
  <g transform="translate(65, 125)">
    <!-- First Bar -->
    <path d="M 12 90 L 42 10 L 58 10 L 28 90 Z" fill="url(#aaaiBlue)" />
    <!-- Second Bar -->
    <path d="M 44 90 L 74 10 L 90 10 L 60 90 Z" fill="url(#aaaiBlue)" />
    <!-- Cross Triangle / A Bar -->
    <path d="M 68 62 L 98 62 L 91 80 L 61 80 Z" fill="url(#aaaiGrey)" />
    <!-- Right leg of A -->
    <path d="M 88 45 L 110 90 L 93 90 L 80 62 Z" fill="url(#aaaiGrey)" />
    <!-- Baseline Subtext -->
    <text x="60" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#8b949e" text-anchor="middle" letter-spacing="2.5">AAAI-27</text>
  </g>

  <!-- ================= RIGHT: NIT JALANDHAR SEAL ================= -->
  <g transform="translate(1040, 125)">
    <!-- Outer Gear Wheel -->
    <circle cx="50" cy="50" r="48" fill="#181c24" stroke="#d4a34b" stroke-width="2.5" stroke-dasharray="7 3.5" />
    <circle cx="50" cy="50" r="43" fill="#13161c" stroke="#f0e6c8" stroke-width="1.2" />
    <circle cx="50" cy="50" r="33" fill="#1a1e27" stroke="#d4a34b" stroke-width="1" />
    <!-- Inner Flame / Lamp & Cog -->
    <path d="M 50 25 C 44 35 43 41 46 47 C 48 44 50 42 50 40 C 50 44 53 46 54 48 C 58 42 56 34 50 25 Z" fill="#f0883e" />
    <circle cx="50" cy="55" r="8" fill="none" stroke="#d4a34b" stroke-width="2" />
    <line x1="50" y1="43" x2="50" y2="67" stroke="#d4a34b" stroke-width="1.5" />
    <line x1="38" y1="55" x2="62" y2="55" stroke="#d4a34b" stroke-width="1.5" />
    <path d="M 36 67 L 64 67 L 50 75 Z" fill="#d4a34b" />
    <!-- Circular text placeholder -->
    <text x="50" y="112" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#8b949e" text-anchor="middle" letter-spacing="2">NITJ</text>
  </g>

  <!-- ================= CENTER: TITLE, AUTHORS, BADGES ================= -->
  <!-- Main Title -->
  <text x="600" y="78" text-anchor="middle" class="title-text">
    DRAVYA: Quantifying Cross-Lingual Cultural Drift
  </text>
  <text x="600" y="116" text-anchor="middle" class="title-text" font-size="28px" fill="#e6edf3">
    Across Dravidian Languages
  </text>

  <!-- AAAI-27 Student Abstract Pill -->
  <g transform="translate(485, 138)">
    <rect width="230" height="28" rx="14" fill="#242b35" stroke="#3d4654" stroke-width="1" />
    <text x="115" y="19" text-anchor="middle" class="badge-text">AAAI-27 Student Abstract</text>
  </g>

  <!-- Authors -->
  <text x="600" y="200" text-anchor="middle" class="author-text">
    Shanmukh Datta¹ &nbsp;&middot;&nbsp; Kumar Prateek¹ &nbsp;&middot;&nbsp; Simranjit Singh¹*
  </text>

  <!-- Affiliation -->
  <text x="600" y="226" text-anchor="middle" class="affil-text">
    ¹Department of Information Technology, NIT Jalandhar &nbsp;&nbsp;&middot;&nbsp;&nbsp; *Corresponding Author
  </text>

  <!-- Bottom Pills -->
  <!-- Pill 1: Scenarios -->
  <g transform="translate(260, 264)">
    <rect width="200" height="30" rx="15" fill="#321a22" stroke="#682333" stroke-width="1" />
    <text x="100" y="20" class="pill-text" fill="#ff7b72">20 Calibrated Dilemmas</text>
  </g>

  <!-- Pill 2: Languages -->
  <g transform="translate(480, 264)">
    <rect width="240" height="30" rx="15" fill="#18263e" stroke="#2d4a7a" stroke-width="1" />
    <text x="120" y="20" class="pill-text" fill="#79c0ff">Telugu &middot; Tamil &middot; Kannada &middot; English</text>
  </g>

  <!-- Pill 3: Evaluation -->
  <g transform="translate(740, 264)">
    <rect width="200" height="30" rx="15" fill="#142c22" stroke="#235c43" stroke-width="1" />
    <text x="100" y="20" class="pill-text" fill="#56d364">6 LLMs + LaBSE Evaluation</text>
  </g>
</svg>
